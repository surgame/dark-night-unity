    const c=$('shipCanvas');let painting=false,last='',erasing=false;

    function paint(e){const q=point(e),{x,y}=q;if(x<0||y<0||x>=32||y>=18){app.shipHover=null;return;}app.shipHover=q;if(!painting)return;const key=x+','+y;if(last===key)return;last=key;const s=app.shipDraft,erase=erasing||e.shiftKey||app.shipBrush==='erase';if(erase){const i=s.parts.findIndex(p=>{const d=D.PARTS[p.type];return x>=p.x&&x<p.x+d.w&&y>=p.y&&y<p.y+d.h;});if(i>=0)s.parts.splice(i,1);else s.cells[y*32+x]=0;}else if(app.shipBrush.startsWith('part:')){const type=app.shipBrush.slice(5),d=D.PARTS[type];if(x+d.w<=32&&y+d.h<=18){s.parts.push({type,x,y});painting=false;}}else s.cells[y*32+x]=D.HULL[app.shipBrush].id;app.shipDirty=true;app.updateShipStats();}
    c.onpointerdown=e=>{e.preventDefault();app.shipUndo.push(D.clone(app.shipDraft));if(app.shipUndo.length>60)app.shipUndo.shift();painting=true;erasing=e.button===2;last='';c.setPointerCapture(e.pointerId);paint(e);};c.onpointermove=paint;c.onpointerup=()=>painting=false;c.onpointerleave=()=>app.shipHover=null;c.oncontextmenu=e=>e.preventDefault();app.updateShipStats();app.drawShipLab();
  };
  app.updateShipStats=function(){if(!$('shipStats'))return;const s=app.shipDraft,e=D.validateShip(s),st=D.shipStats(s),delta=D.shipDifference(app.game.ship,s);$('shipErrors').innerHTML=e.length?'<span class="bad">'+e.map(D.escape).join('　')+'</span>':'<span class="good">✓ 蓝图有效 · 可安装并保留到下一次起降</span>';$('shipApply').disabled=e.length>0;$('shipStats').innerHTML=`<div><strong>${st.count}</strong><small>船体结构格</small></div><div><strong>${st.lift} / ${st.mass}</strong><small>升力 / 质量</small></div><div><strong>${st.power>=0?'+':''}${st.power}</strong><small>剩余功率</small></div><div><strong>${s.parts.length}</strong><small>已安装设备</small></div>`;$('shipCosts').innerHTML='<span>本次改装：</span>'+Object.entries(delta).filter(([k,v])=>v).map(([k,v])=>`<span class="${v>app.game.bank[k]?'bad':''}">${v>0?'消耗':'回收'} ${D.resources[k]} ${Math.abs(v)}${v>0?' / 持有 '+Math.floor(app.game.bank[k]):''}</span>`).join('')+(Object.values(delta).every(v=>!v)?'<span>无材料差额</span>':'');document.querySelectorAll('[data-brush]').forEach(b=>b.classList.toggle('active',b.dataset.brush===app.shipBrush));document.querySelectorAll('[data-part]').forEach(b=>b.classList.toggle('active','part:'+b.dataset.part===app.shipBrush));};
  app.drawShipLab=function(){if(!$('shipCanvas'))return;const c=$('shipCanvas'),g=c.getContext('2d');rect(g,0,0,320,200,'#193025');for(let i=0;i<40;i++)rect(g,D.noise(112,i,0)*320,D.noise(113,i,1)*200,1,1,'#455f4155');for(let x=32;x<=288;x+=8)line(g,x,24,x,168,'#5b74403b');for(let y=24;y<=168;y+=8)line(g,32,y,288,y,'#5b74403b');g.strokeStyle='#83925d77';g.strokeRect(31.5,23.5,257,145);D.Art.ship(g,app.shipDraft,32,24,0,false,false);const q=app.shipHover;if(q){const x=32+q.x*8,y=24+q.y*8;g.save();if(app.shipBrush.startsWith('part:')){const type=app.shipBrush.slice(5),d=D.PARTS[type];g.globalAlpha=.6;D.Art.part(g,type,x,y);g.globalAlpha=1;g.strokeStyle='#d0bd7b';g.strokeRect(x+.5,y+.5,d.w*8-1,d.h*8-1);}else{g.fillStyle=app.shipBrush==='erase'?'#bf97786b':'#b5c28a44';g.fillRect(x,y,8,8);g.strokeStyle='#d0bd7b';g.strokeRect(x+.5,y+.5,7,7);}g.restore();}g.fillStyle='#a7b28e';g.font='7px monospace';g.textAlign='left';g.fillText('32 × 18 cells / 8 px per cell / side view',32,187);g.textAlign='right';g.fillText('DRAFT · '+app.shipDraft.parts.length+' MODULES',288,187);};
})(DN);

(function(D){
  /** Executable, local assertions for the precisely shared contract subset. */
  D.runContracts=function(){const out=[],check=(name,f)=>{try{out.push({name,pass:!!f()});}catch(e){out.push({name,pass:false,error:e.message});}};
    for(let mask=0;mask<16;mask++)check('corner bits / mask '+mask,()=>{const g=new D.Grid(8,8);for(const[x,y,i]of[[3,3,0],[4,3,1],[3,4,2],[4,4,3]])g.data[y*8+x]=mask&(1<<i)?1:0;return g.mask(3,3)===mask;});
    check('mask 6 separated at diagonal center',()=>D.topologyOwner([0,1,1,0],.5,.5)===0);check('mask 9 connected at diagonal center',()=>D.topologyOwner([1,0,0,1],.5,.5)===1);
    for(let key=0;key<625;key++)check('multi-material ownership '+key,()=>{const labels=[0,1,2,3].map(i=>Math.floor(key/5**i)%5);for(let y=0;y<8;y++)for(let x=0;x<8;x++){const t=D.topologyOwner(labels,(x+.5)/8,(y+.5)/8);if(t!==0&&!labels.includes(t))return false;}return true;});
    check('unknown differs from empty',()=>new D.Grid(8,8).mask(7,7)===null);check('four affected visuals',()=>{const g=new D.Grid(8,8);g.edit([[4,4,2]]);return g.dirty.size===4&&['4,4','3,4','4,3','3,3'].every(s=>g.dirty.has(s));});
    check('no-op transaction is not a revision',()=>{const g=new D.Grid(8,8);g.edit([[4,4,0]]);return g.revision===0;});check('invalid transaction is atomic',()=>{const g=new D.Grid(8,8);try{g.edit([[4,4,2],[-1,0,3]]);}catch{}return g.at(4,4)===0&&g.revision===0;});
    check('negative coordinate affected set',()=>D.Grid.affected(-2,-3).map(p=>p.join(',')).join('|')==='-2,-3|-3,-3|-2,-4|-3,-4');
    check('Y-down / Unity Y-up source mapping',()=>{const x=3,y=5,uv=[x,-y-1],src=[[uv[0],uv[1]+1],[uv[0]+1,uv[1]+1],[uv[0],uv[1]],[uv[0]+1,uv[1]]];return JSON.stringify(src)===JSON.stringify([[3,-5],[4,-5],[3,-6],[4,-6]]);});
    check('default ship valid',()=>D.validateShip(D.newShip()).length===0);check('detached hull rejected',()=>{const s=D.newShip();s.cells[0]=1;return D.validateShip(s).some(e=>e.includes('悬空'));});check('overlapping equipment rejected',()=>{const s=D.newShip();s.parts.push({...s.parts[0]});return D.validateShip(s).some(e=>e.includes('重叠'));});check('missing cockpit rejected',()=>{const s=D.newShip();s.parts=s.parts.filter(p=>p.type!=='cockpit');return D.validateShip(s).some(e=>e.includes('驾驶舱'));});
    check('RLE round-trip',()=>{const a=new Uint8Array([0,0,1,1,1,2,8,8]);return D.unpackRuns(D.packRuns(a),8).every((v,i)=>v===a[i]);});check('corrupt RLE rejected',()=>{try{D.unpackRuns([8,9],8);}catch{return true;}return false;});
    check('PNG native atlas size',()=>{const c=new D.Tiles().allAtlas();return c.width===128&&c.height===256;});
    check('mask zero has no alpha',()=>{const c=new D.Tiles().mask(0),a=c.getContext('2d').getImageData(0,0,8,8).data;return a.every((v,i)=>i%4!==3||v===0);});
    check('same texture seed same pixels',()=>{const a=new D.Tiles(D.palette,125).atlas(2).toDataURL(),b=new D.Tiles(D.palette,125).atlas(2).toDataURL();return a===b;});
    return out;
  };
})(DN);

DN.app.start();
