<div id="painted-wfc-cave">
  <style>
    #painted-wfc-cave {width:100%;color:var(--foreground)}
    #painted-wfc-cave .art-stage {display:block;width:100%;height:450px;touch-action:none}
    #painted-wfc-cave .art-mini {display:block;width:100%;height:96px;margin-top:8px;touch-action:none}
    #painted-wfc-cave .art-controls {margin-bottom:10px}
    #painted-wfc-cave .art-status {margin-top:8px;min-height:22px}
    @media(max-width:480px){#painted-wfc-cave .art-stage{height:360px}}
  </style>
  <div class="viz-controls art-controls">
    <label class="form-label">地图
      <select id="art-seed" class="form-select">
        <option value="271">灰松深廊</option><option value="902">分岔矿室</option><option value="1643">层叠地洞</option>
      </select>
    </label>
    <label class="form-label">画面
      <select id="art-mode" class="form-select">
        <option value="scene">美术拼接</option><option value="geometry">同图形状</option><option value="catalog">16类模块</option><option value="sources">原生素材</option>
      </select>
    </label>
    <button class="btn" id="art-all" type="button">全图</button>
    <button class="btn" id="art-local" type="button">下一洞室</button>
    <label class="form-check"><input id="art-grid" class="form-check-input" type="checkbox"><span class="form-check-label">连接网格</span></label>
  </div>
  <canvas id="art-scene" class="art-stage cursor-interaction" role="img" aria-label="可拖动与缩放的手绘洞穴WFC拼接地图"></canvas>
  <canvas id="art-minimap" class="art-mini cursor-interaction" role="img" aria-label="完整320乘192格地图；点击移动局部镜头"></canvas>
  <div id="art-status" class="art-status text-small" aria-live="polite">正在装配素材…</div>
  <script>
/*__SOURCES__*/
/*__CODE__*/
  </script>
</div>
